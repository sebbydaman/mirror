name: NS2 build142 runtime donor preflight

on:
  workflow_dispatch:
  push:
    branches:
      - ns2-pokopia-startup-fast-win32
    paths:
      - '.github/workflows/ns2-build142-runtime-preflight.yml'
      - '.github/frontier/apply-build142-runtime.ps1'
      - '.github/frontier/build142-runtime.patch'
      - '.github/frontier/test-build142-runtime.ps1'

permissions:
  contents: read

concurrency:
  group: ns2-build142-runtime-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-runtime:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      EDEN_SKIP_POST_BUILD31_FRONTIER: '1'

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout pinned Eglantine source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Assemble exact canonical Pokopia stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Pokopia stack failed diff check before runtime donor' }

      - name: Apply isolated build142 runtime donor
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-build142-runtime.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Build142 runtime donor failed to apply' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Build142 runtime donor failed diff check' }

      - name: Runtime donor source invariants
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\frontier\test-build142-runtime.ps1"'

      - name: Regression 01 core NS2
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-regressions.ps1"'

      - name: Regression 02 PokeDinner performance
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-pokedinner-performance.ps1"'

      - name: Regression 03 late NS2
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-late-regressions.ps1"'

      - name: Regression 04 stability
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-stability-regressions.ps1"'

      - name: Confirm runtime donor remains out of production composition
        shell: pwsh
        working-directory: automation
        run: |
          $final = Get-Content '.github/frontier/apply-final-performance-stack.ps1' -Raw
          if ($final.Contains("& `$runtime") -or $final.Contains("apply-build142-runtime.ps1'`n    &")) {
            throw 'Runtime donor was unexpectedly wired into production composition'
          }
          Write-Host '[PASS] Runtime donor remains isolated from canonical final stack.'
