name: Build Eden NS2 Final Zen4 PGO

on:
  workflow_dispatch:
  push:
    branches:
      - ns2-pokopia-final-perf
      - ns2-pokopia
    paths:
      - '.github/workflows/ns2-final-zen4.yml'
      - '.github/frontier/**'

permissions:
  contents: read

concurrency:
  group: ns2-final-zen4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-final-zen4:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Apply validated base NS2 stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"

      - name: Apply final NS2 performance stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          git diff --check

      - name: Validate integrated final source
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-regressions.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-pokedinner-performance.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-late-regressions.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-stability-regressions.ps1"

      - name: Download Eden LLVM PGO profile
        shell: pwsh
        working-directory: eden
        run: |
          Invoke-WebRequest -Uri 'https://github.com/Eden-CI/PGO/releases/latest/download/eden.profdata' -OutFile eden.profdata
          if (-not (Test-Path eden.profdata -PathType Leaf)) { throw 'PGO profile download failed' }
          if ((Get-Item eden.profdata).Length -lt 1024) { throw 'PGO profile is unexpectedly small' }

      - name: Set up MSYS2 clang PGO toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p

      - name: Configure final Zen4 tune-only PGO build
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eden.profdata") -Wno-backend-plugin -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          zen4="-mtune=znver4"
          cmake -S . -B build-final -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile $zen4" \
            "-DCMAKE_CXX_FLAGS=$profile $zen4"

      - name: Build final video_core
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build-final --target video_core --parallel 4 --verbose

      - name: Build final GUI runtime
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build-final --target yuzu --parallel 4 --verbose

      - name: Bundle runtime and Qt dependencies
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build-final/bin
          exe=''
          for candidate in eglantine.exe eden.exe yuzu.exe; do
            if [ -f "$candidate" ]; then exe="$candidate"; break; fi
          done
          [ -n "$exe" ] || { echo 'No GUI executable found' >&2; exit 1; }

          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler "$exe"

          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in *System32* | *SysWOW64*) continue ;; esac
              if [ ! -f "$dll" ]; then cp "$source" "$dll"; deps "$source"; fi
            done
          }
          deps "$exe"
          find . -name '*.dll' -print0 | while IFS= read -r -d '' dll; do deps "$dll"; done

          cat > FINAL_BUILD_NOTES.txt <<'EOF'
          Eden NS2 final performance build
          ================================
          Safe Ryzen 7000 optimization: LLVM PGO + -mtune=znver4 (no -march=znver4).
          Includes the validated Build-31/JIT/GPU-written, DMA, descriptor, texture-cache,
          readback-state, memory/pushbuffer performance stack and the bounded NS2 two-worker
          exception for drivers that otherwise force pipeline compilation to one worker.
          EOF

      - name: Stage final portable artifact
        shell: pwsh
        working-directory: eden
        run: |
          $source = 'build-final/bin'
          $out = 'dist/Eden-NS2-Final-PGO-Zen4-Windows'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "$source\*" $out -Recurse -Force
          $gui = @('eglantine.exe','eden.exe','yuzu.exe') | ForEach-Object { Join-Path $out $_ } | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $gui) { throw 'Final package has no GUI executable' }

      - name: Upload final optimized runtime
        uses: actions/upload-artifact@v7
        with:
          name: Eden-NS2-Final-PGO-Zen4-Windows-${{ github.sha }}
          path: eden/dist/Eden-NS2-Final-PGO-Zen4-Windows/**
          if-no-files-found: error
          retention-days: 14
