name: Build Eden NS2 PGO Production Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - ns2-pokopia
    paths:
      - '.github/workflows/ns2-pgo-production.yml'

permissions:
  contents: read

# Experimental optimized release path. The protected production/rollback runtime remains the normal
# MSVC ns2-pokopia workflow. This build follows the working zortos293/Eglantine build-31 approach:
# MinGW clang consumes Eden-CI's current LLVM profile, then every non-system runtime DLL is bundled.
concurrency:
  group: ns2-pokopia-pgo-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pgo-production:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Apply validated NS2 integration stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"

      - name: Validate final integrated source before PGO
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-regressions.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-pokedinner-performance.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-late-regressions.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-stability-regressions.ps1"

      - name: Download current Eden LLVM PGO profile
        shell: pwsh
        working-directory: eden
        run: |
          $uri = 'https://github.com/Eden-CI/PGO/releases/latest/download/eden.profdata'
          Invoke-WebRequest -Uri $uri -OutFile eden.profdata
          if (-not (Test-Path eden.profdata -PathType Leaf)) { throw 'PGO profile download failed' }
          if ((Get-Item eden.profdata).Length -lt 1024) { throw 'Downloaded PGO profile is unexpectedly small' }
          Write-Host "PGO profile bytes: $((Get-Item eden.profdata).Length)"

      - name: Set up MSYS2 clang PGO toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p

      - name: Configure profile-use Release build
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          profile="-fprofile-use=$(cygpath -m "$PWD/eden.profdata") -Wno-backend-plugin -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          clang --version
          cmake -S . -B build-pgo-prod -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_CUBEB=OFF \
            -DENABLE_LIBUSB=OFF \
            -DENABLE_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Build PGO video_core first
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build-pgo-prod --target video_core --parallel 4 --verbose

      - name: Build PGO GUI runtime
        shell: msys2 {0}
        working-directory: eden
        run: cmake --build build-pgo-prod --target yuzu --parallel 4 --verbose

      - name: Bundle MinGW runtime and Qt dependencies
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build-pgo-prod/bin
          exe=''
          for candidate in eglantine.exe eden.exe yuzu.exe; do
            if [ -f "$candidate" ]; then exe="$candidate"; break; fi
          done
          if [ -z "$exe" ]; then
            echo 'No GUI executable found in PGO output.' >&2
            exit 1
          fi

          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler "$exe"

          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }

          deps "$exe"
          find . -name '*.dll' -print0 | while IFS= read -r -d '' dll; do
            deps "$dll"
          done

          cat > PGO_BUILD_NOTES.txt <<'EOF'
          Eden NS2 experimental production PGO build
          ===========================================
          This is the same validated ns2-pokopia integration stack compiled with MinGW clang and
          Eden-CI's current LLVM profile. It is intentionally separate from the normal MSVC release.

          Purpose: measure whether profile-guided optimization improves sustained CPU-bound gameplay,
          especially MKW heavy-course command processing and first-race CPU/JIT overhead.

          The profile is generic Eden training data, not yet our own MKW/Pokopia corpus. If this build
          shows a measurable win, the next PGO step is to merge representative profiles collected from
          our own games and rebuild with that project-specific corpus.
          EOF

          cat > POKOPIA_CONFIG.txt <<'EOF'
          [Core]
          memory_layout_mode\default=false
          memory_layout_mode=4
          use_multi_core\default=false
          use_multi_core=false

          [Renderer]
          backend\default=false
          backend=1
          EOF

          cat > run-nx2-gpu-profile.cmd <<EOF
          @echo off
          setlocal
          set EDEN_NX2_GPU_PROFILE=1
          set EDEN_NX2_TC_LOG=0
          set EDEN_NX2_GPU_PROFILE_PAGES=0
          "%~dp0$exe" %* 2^> "%~dp0NX2_GPU_PROFILE.log"
          echo Profile log: %~dp0NX2_GPU_PROFILE.log
          endlocal
          EOF

          echo "PGO GUI: $exe"
          ls -lah

      - name: Stage PGO portable artifact
        shell: pwsh
        working-directory: eden
        run: |
          $source = 'build-pgo-prod/bin'
          $out = 'dist/Eden-NS2-PGO-Windows'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "$source\*" $out -Recurse -Force
          $gui = @('eglantine.exe', 'eden.exe', 'yuzu.exe') |
            ForEach-Object { Join-Path $out $_ } |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $gui) { throw 'Staged PGO package has no GUI executable' }
          Write-Host "Staged PGO GUI: $gui"
          Write-Host "Package bytes: $((Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum)"

      - name: Upload PGO production runtime
        uses: actions/upload-artifact@v7
        with:
          name: Eden-NS2-PGO-Windows-${{ github.sha }}
          path: eden/dist/Eden-NS2-PGO-Windows/**
          if-no-files-found: error
          retention-days: 14
