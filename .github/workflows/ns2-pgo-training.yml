name: Build Eden NS2 PGO Training Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

# This is deliberately manual and isolated from the proven MSVC build. It produces an
# instrumented clang-cl runtime that records representative local gameplay into .profraw files.
# Those profiles can later train a separate use-profile build without changing the normal release.
concurrency:
  group: ns2-pokopia-pgo-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pgo-training:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Apply fully validated NS2 integration stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"

      - name: Validate integrated regression surface
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-regressions.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-pokedinner-performance.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-late-regressions.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-stability-regressions.ps1"

      - name: Verify clang PGO toolchain
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
          $profdata = Get-Command llvm-profdata.exe -ErrorAction SilentlyContinue
          if (-not $clang) { throw 'clang-cl.exe is unavailable on this Windows runner' }
          if (-not $profdata) { throw 'llvm-profdata.exe is unavailable on this Windows runner' }
          Write-Host "clang-cl: $($clang.Source)"
          & $clang.Source --version
          Write-Host "llvm-profdata: $($profdata.Source)"
          & $profdata.Source --version

      - name: Restore CPM dependency cache
        uses: actions/cache@v4
        with:
          path: eden/.cache/cpm
          key: eden-eglantine-pgo-cpm-${{ runner.os }}-${{ hashFiles('eden/cpmfile.json') }}
          restore-keys: |
            eden-eglantine-pgo-cpm-${{ runner.os }}-

      - name: Install Vulkan SDK
        shell: pwsh
        working-directory: eden
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure instrumented x86-64-v3 Release build
        shell: pwsh
        working-directory: eden
        run: |
          $cpm = "$env:GITHUB_WORKSPACE\eden\.cache\cpm"
          $common = '-march=x86-64-v3 -fprofile-instr-generate'
          cmake -S . -B build-pgo -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_C_FLAGS_RELEASE="$common /O2 /DNDEBUG" `
            -DCMAKE_CXX_FLAGS_RELEASE="$common /O2 /DNDEBUG" `
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate" `
            -DCMAKE_SHARED_LINKER_FLAGS="-fprofile-instr-generate" `
            -DCPM_SOURCE_CACHE="$cpm" `
            -DYUZU_TESTS=OFF `
            -DBUILD_TESTING=OFF `
            -DENABLE_WERROR=OFF `
            -DENABLE_QT_TRANSLATION=OFF `
            -DYUZU_USE_BUNDLED_FFMPEG=ON `
            -DENABLE_WEB_SERVICE=OFF `
            -DENABLE_CUBEB=OFF `
            -DENABLE_LIBUSB=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build instrumented NS2 runtime
        shell: pwsh
        working-directory: eden
        run: |
          cmake --build build-pgo --target video_core --parallel 4 --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-pgo --target yuzu --parallel 4 --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage PGO training runtime
        shell: pwsh
        working-directory: eden
        run: |
          $source = 'build-pgo/bin'
          if (-not (Test-Path $source -PathType Container)) { throw "PGO build output missing: $source" }
          $gui = @('eglantine.exe', 'eden.exe', 'yuzu.exe') |
            ForEach-Object { Join-Path $source $_ } |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $gui) { throw 'Instrumented build does not contain an Eden GUI executable.' }

          $out = 'dist/Eden-NS2-PGO-Training-Windows'
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item "$source\*" $out -Recurse -Force

          $exe = Split-Path $gui -Leaf
          @"
          @echo off
          setlocal
          if not exist "%~dp0pgo-profiles" mkdir "%~dp0pgo-profiles"
          set "LLVM_PROFILE_FILE=%~dp0pgo-profiles\eden-%p-%m.profraw"
          echo Recording LLVM PGO profile data to: %LLVM_PROFILE_FILE%
          echo Exit Eden normally after each representative gameplay session so the profile is flushed.
          start "" /wait "%~dp0$exe" %*
          echo.
          echo Session complete. Keep the pgo-profiles folder for profile merging.
          endlocal
          "@ | Set-Content -Path (Join-Path $out 'run-pgo-training.cmd') -Encoding ASCII

          @'
          Eden NS2 PGO Training Runtime
          =============================

          This is NOT the normal release build. It is an instrumented clang-cl x86-64-v3 build
          whose only purpose is to collect representative execution profiles for a later optimized
          use-profile build.

          1. Launch run-pgo-training.cmd rather than the EXE directly.
          2. Use representative workloads: Pokopia gameplay, shader-heavy traversal, menus/loading,
             and—if available to you—other demanding NS2 titles/scenes you actually want optimized.
          3. Exit Eden normally after each session. LLVM writes .profraw files into pgo-profiles.
          4. Keep profiles from multiple sessions. They can be merged with llvm-profdata into one
             training corpus for the optimized build.
          5. Do not judge performance from this binary: instrumentation intentionally adds overhead.

          The normal ns2-pokopia MSVC build remains the protected production/rollback path.
          '@ | Set-Content -Path (Join-Path $out 'PGO_TRAINING_README.txt') -Encoding UTF8

          @'
          [Core]
          memory_layout_mode\default=false
          memory_layout_mode=4
          use_multi_core\default=false
          use_multi_core=false

          [Renderer]
          backend\default=false
          backend=1
          '@ | Set-Content -Path (Join-Path $out 'POKOPIA_CONFIG.txt') -Encoding UTF8

          @'
          This training build contains the same validated NS2 integration stack as the normal
          branch build, plus LLVM profile instrumentation. Performance profiling can additionally
          be enabled with EDEN_NX2_GPU_PROFILE=1 when diagnosing GPU-thread hot paths.
          '@ | Set-Content -Path (Join-Path $out 'NX2_PERFORMANCE_NOTES.txt') -Encoding UTF8

          Write-Host "PGO training GUI: $gui"
          Get-ChildItem $out | Select-Object Name, Length

      - name: Upload PGO training runtime
        uses: actions/upload-artifact@v7
        with:
          name: Eden-NS2-PGO-Training-${{ github.sha }}
          path: eden/dist/Eden-NS2-PGO-Training-Windows/**
          if-no-files-found: error
          retention-days: 14
