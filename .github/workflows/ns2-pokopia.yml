name: Build Eden NS2 Pokopia

on:
  push:
    branches:
      - ns2-pokopia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout complete NS2 source
        uses: actions/checkout@v5
        with:
          repository: ShadyHero/Eden-NS2
          ref: 1a6d7d4bf2b55feba32f56d2119aeeeeaab19823
          path: eden
          fetch-depth: 1

      - name: Verify complete NS2 tree
        shell: pwsh
        working-directory: eden
        run: |
          $required = @(
            "src/core/hle/service/am/service/gpu_session.cpp",
            "src/core/hle/service/am/service/graphics_supervisor.cpp",
            "src/core/hle/service/nvdrv/devices/nvhost_tsg_gpu.cpp",
            "src/shader_recompiler/frontend/ampere/lower_to_maxwell.h",
            "src/video_core/native_qmd.h",
            "src/video_core/native_semaphore.h",
            "src/video_core/macro_turing.h"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Incomplete NS2 source tree: missing $path" }
          }
          Write-Host "Pinned NS2 source: $(git rev-parse HEAD)"

      - name: Apply Pokopia and compiler compatibility fixes
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-ns2-build-fixes.ps1"

      - name: Install Vulkan SDK
        shell: pwsh
        working-directory: eden
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Release build
        shell: pwsh
        working-directory: eden
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          $cmake = 'cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYUZU_TESTS=OFF -DBUILD_TESTING=OFF -DENABLE_WERROR=OFF -DENABLE_QT_TRANSLATION=OFF -DYUZU_USE_BUNDLED_FFMPEG=ON -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF'
          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && $cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Eden GUI target only
        shell: pwsh
        working-directory: eden
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          # CMake target is still named "yuzu"; its OUTPUT_NAME is "eden" (eden.exe).
          $command = "`"$devcmd`" -arch=x64 -host_arch=x64 && cmake --build build --target yuzu --parallel 4 --verbose > build.log 2>&1"
          cmd /c $command
          $buildExitCode = $LASTEXITCODE
          if (Test-Path build.log) { Get-Content build.log }
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Eden-NS2-Pokopia-build-log
          path: eden/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Add Pokopia config and source note
        shell: pwsh
        working-directory: eden
        run: |
          $bin = "build/bin"

          @'
          Add these values to the appropriate sections of Eden's qt-config.ini:

          [Core]
          memory_layout_mode\default=false
          memory_layout_mode=4
          use_multi_core\default=false
          use_multi_core=false

          [Renderer]
          backend\default=false
          backend=1
          '@ | Set-Content -Path "$bin\POKOPIA_CONFIG.txt" -Encoding UTF8

          @'
          NS2 source: ShadyHero/Eden-NS2
          Pinned commit: 1a6d7d4bf2b55feba32f56d2119aeeeeaab19823
          Eden base lineage: 05f36d990ce5301b310871451201a72e4c52b4df
          '@ | Set-Content -Path "$bin\BUILD_SOURCE.txt" -Encoding UTF8

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Eden-NS2-Pokopia-Windows
          path: eden/build/bin/**
          if-no-files-found: error
          compression-level: 6
