name: Build Eden NS2 Pokopia

on:
  push:
    branches:
      - ns2-pokopia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 120

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: 50c9fd3471d5f0170a7495ee10fd8b0b2f0298e1
          path: eden
          fetch-depth: 1

      - name: Verify Eglantine NS2 tree
        shell: pwsh
        working-directory: eden
        run: |
          $required = @(
            "src/shader_recompiler/frontend/ampere/lower_to_maxwell.h",
            "src/video_core/shader_environment.cpp",
            "src/video_core/shader_cache.h",
            "src/video_core/native_qmd.h",
            "src/video_core/macro_turing.h",
            "src/core/hle/service/nx2_gsv.h"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Incomplete Eglantine NS2 source tree: missing $path" }
          }
          Write-Host "Pinned Eglantine source: $(git rev-parse HEAD)"

      - name: Apply best-of-both NS2 integration patches
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"

      - name: Validate combined NS2 regression surface
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-regressions.ps1"

      - name: Restore CPM dependency cache
        uses: actions/cache@v4
        with:
          path: eden/.cache/cpm
          key: eden-eglantine-cpm-${{ runner.os }}-${{ hashFiles('eden/cpmfile.json') }}
          restore-keys: |
            eden-eglantine-cpm-${{ runner.os }}-

      - name: Install Vulkan SDK
        shell: pwsh
        working-directory: eden
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Release build
        shell: pwsh
        working-directory: eden
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl 2>&1 | findstr /C:`"Version`""
          $cpm = "$env:GITHUB_WORKSPACE\eden\.cache\cpm"
          $cmake = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCPM_SOURCE_CACHE=$cpm -DYUZU_TESTS=OFF -DBUILD_TESTING=OFF -DENABLE_WERROR=OFF -DENABLE_QT_TRANSLATION=OFF -DYUZU_USE_BUNDLED_FFMPEG=ON -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF"
          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && $cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NS2 video_core first
        shell: pwsh
        working-directory: eden
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          $command = "`"$devcmd`" -arch=x64 -host_arch=x64 && cmake --build build --target video_core --parallel 4 --verbose > video_core.log 2>&1"
          cmd /c $command
          $buildExitCode = $LASTEXITCODE
          if (Test-Path video_core.log) { Get-Content video_core.log }
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Build Eden GUI target
        shell: pwsh
        working-directory: eden
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          $command = "`"$devcmd`" -arch=x64 -host_arch=x64 && cmake --build build --target yuzu --parallel 4 --verbose > build.log 2>&1"
          cmd /c $command
          $buildExitCode = $LASTEXITCODE
          if (Test-Path build.log) { Get-Content build.log }
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Eden-NS2-Pokopia-build-log
          path: |
            eden/video_core.log
            eden/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Add Pokopia config and source note
        shell: pwsh
        working-directory: eden
        run: |
          $bin = "build/bin"
          @'
          Add these values to the appropriate sections of Eden's qt-config.ini:

          [Core]
          memory_layout_mode\default=false
          memory_layout_mode=4
          use_multi_core\default=false
          use_multi_core=false

          [Renderer]
          backend\default=false
          backend=1
          '@ | Set-Content -Path "$bin\POKOPIA_CONFIG.txt" -Encoding UTF8

          @'
          NS2 source: Djihads80/Eglantine
          Pinned commit: 50c9fd3471d5f0170a7495ee10fd8b0b2f0298e1
          Integration: Eglantine broad NS2 platform/GPU support + sebbydaman/mirror shader improvements.
          Preserved improvements: bindless 2D/cube TEX, extended TXQ, generalized BRX/BRXU, native geometry OUT, validated geometry stage admission.
          Positive native shader cache: enabled with exact-source verification (4096 entries).
          Eglantine negative shader cache and ARMv8.1 LSE atomic support: preserved.
          Generic 0x2593 Bananza overlap: Maxwell PRMT, 8-bit F2I, native geometry ISBERD/LEPC/prologue lowering.
          Vulkan draw-state optimization: exact-payload push descriptors are reused within a valid command-buffer pipeline context.
          Combined regression validation: enabled before compilation.
          Portable Windows packaging: dependency-audited; non-system DLL imports bundled recursively.
          '@ | Set-Content -Path "$bin\BUILD_SOURCE.txt" -Encoding UTF8

      - name: Package portable Windows runtime
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\package-windows-runtime.ps1" -BinDir "build/bin"

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Eden-NS2-Pokopia-Windows
          path: eden/build/bin/**
          if-no-files-found: error
          compression-level: 6
