name: Build Eden NS2 Pokopia

on:
  push:
    branches:
      - ns2-pokopia
  workflow_dispatch:

permissions:
  contents: read

# Keep the compile already in progress, but retain only the newest pending build for this branch.
# That lets us continue integrating fixes without creating an unbounded 40-50 minute build queue.
concurrency:
  group: ns2-pokopia-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      SCCACHE_DIR: ${{ github.workspace }}/eden/.sccache
      SCCACHE_CACHE_SIZE: 1500M

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Verify Eglantine NS2 tree
        shell: pwsh
        working-directory: eden
        run: |
          $required = @(
            "src/shader_recompiler/frontend/ampere/lower_to_maxwell.h",
            "src/video_core/shader_environment.cpp",
            "src/video_core/shader_cache.h",
            "src/video_core/native_qmd.h",
            "src/video_core/macro_turing.h",
            "src/core/hle/service/nx2_gsv.h"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Incomplete Eglantine NS2 source tree: missing $path" }
          }
          Write-Host "Bootstrap Eglantine source: $(git rev-parse HEAD)"

      - name: Apply best-of-both NS2 integration patches
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"

      - name: Validate combined NS2 regression surface
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-regressions.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-pokedinner-performance.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-late-regressions.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-stability-regressions.ps1"

      - name: Packaging workflow preflight
        shell: pwsh
        run: |
          $scripts = @(
            "$env:GITHUB_WORKSPACE\automation\.github\scripts\stage-ns2-runtime-checkpoint.ps1",
            "$env:GITHUB_WORKSPACE\automation\.github\scripts\package-ns2-runtime.ps1"
          )
          foreach ($script in $scripts) {
            if (-not (Test-Path $script -PathType Leaf)) { throw "Required packaging script is missing: $script" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell syntax error in $script: $messages"
            }
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere -PathType Leaf)) { throw 'Visual Studio locator is unavailable on the Windows runner.' }
          Write-Host 'Packaging scripts and Windows runner prerequisites passed preflight.'

      - name: Restore CPM dependency cache
        uses: actions/cache@v4
        with:
          path: eden/.cache/cpm
          key: eden-eglantine-cpm-${{ runner.os }}-${{ hashFiles('eden/cpmfile.json') }}
          restore-keys: |
            eden-eglantine-cpm-${{ runner.os }}-

      - name: Install sccache for MSVC
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          $root = Join-Path $env:RUNNER_TEMP 'sccache'
          Expand-Archive $zip -DestinationPath $root
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe $root | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw 'sccache.exe was not found after extraction' }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Restore MSVC object cache
        uses: actions/cache@v4
        with:
          path: eden/.sccache
          # A unique key lets every successful run publish its improved cache; restore-keys seeds
          # the next build from the newest cache for this Windows NS2 branch.
          key: eden-ns2-sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            eden-ns2-sccache-${{ runner.os }}-

      - name: Install Vulkan SDK
        shell: pwsh
        working-directory: eden
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Release build
        shell: pwsh
        working-directory: eden
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cl 2>&1 | findstr /C:`"Version`""
          $cpm = "$env:GITHUB_WORKSPACE\eden\.cache\cpm"
          $cmake = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCPM_SOURCE_CACHE=$cpm -DYUZU_TESTS=OFF -DBUILD_TESTING=OFF -DENABLE_WERROR=OFF -DENABLE_QT_TRANSLATION=OFF -DYUZU_USE_BUNDLED_FFMPEG=ON -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && $cmake"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NS2 video_core first
        shell: pwsh
        working-directory: eden
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          $command = "`"$devcmd`" -arch=x64 -host_arch=x64 && cmake --build build --target video_core --parallel 4 --verbose > video_core.log 2>&1"
          cmd /c $command
          $buildExitCode = $LASTEXITCODE
          if (Test-Path video_core.log) { Get-Content video_core.log }
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Build Eden GUI target
        shell: pwsh
        working-directory: eden
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"
          $command = "`"$devcmd`" -arch=x64 -host_arch=x64 && cmake --build build --target yuzu --parallel 4 --verbose > build.log 2>&1"
          cmd /c $command
          $buildExitCode = $LASTEXITCODE
          if (Test-Path build.log) { Get-Content build.log }
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Show sccache statistics
        if: always()
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          } else {
            Write-Host 'sccache is unavailable; no compiler-cache statistics to show.'
          }

      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Eden-NS2-Pokopia-build-log
          path: |
            eden/video_core.log
            eden/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Add Pokopia config and source note
        shell: pwsh
        working-directory: eden
        run: |
          $bin = "build/bin"
          @'
          Add these values to the appropriate sections of Eden's qt-config.ini:

          [Core]
          memory_layout_mode\default=false
          memory_layout_mode=4
          use_multi_core\default=false
          use_multi_core=false

          [Renderer]
          backend\default=false
          backend=1
          '@ | Set-Content -Path "$bin\POKOPIA_CONFIG.txt" -Encoding UTF8

          @'
          PokeDinner / Eglantine Switch 2 performance controls
          ====================================================
          Normal use: leave these variables UNSET. The optimized behavior is the default.

          EDEN_NX2_SPLIT=0
            Disable split GPU front/back threads. Default is mode 2 when the runtime safety
            conditions allow it; mode 1 keeps macros on the back thread.

          EDEN_NX2_MME_JIT=0
            Disable the x86-64 Turing MME JIT and fall back to memo/interpreter execution.

          EDEN_NX2_BUFFER_DOWNLOADS=1
            Re-enable per-fence GPU-written buffer downloads. This is a correctness/debug fallback;
            Switch 2 native-tiled memory normally leaves them off for performance.

          EDEN_NX2_FENCE_BATCH=0
            Disable batching of already-signaled fences.

          EDEN_NX2_SKIP_SAME=0
            Disable same-value state-register write elimination.

          EDEN_NX2_INLINE_DEFER=0
            Disable deferred inline invalidation.

          Additional preserved donor optimizations include empty-fence skipping, per-thread device
          translation caches, stack macro parameters, CNTPCT pause mitigation, reduced Vulkan worker
          wakeups, macro-memo compaction, FastHash/RangeSet fast paths, Switch 2 buffer-only garbage
          collection, native-compute direct register writes, async-present scheduler safety, and
          GPU-split session reset.
          '@ | Set-Content -Path "$bin\NX2_PERFORMANCE_NOTES.txt" -Encoding UTF8

      - name: Stage reusable compiled runtime checkpoint
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\stage-ns2-runtime-checkpoint.ps1"

      - name: Upload compiled Windows checkpoint
        uses: actions/upload-artifact@v7
        with:
          name: Eden-NS2-Pokopia-compiled-${{ github.sha }}
          path: eden/build/bin/**
          if-no-files-found: error
          retention-days: 14

  package-windows:
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout packaging automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Download compiled Windows checkpoint
        uses: actions/download-artifact@v8
        with:
          name: Eden-NS2-Pokopia-compiled-${{ github.sha }}
          path: eden/build/bin

      - name: Validate downloaded compile checkpoint
        shell: pwsh
        run: |
          $bin = "$env:GITHUB_WORKSPACE\eden\build\bin"
          if (-not (Test-Path $bin -PathType Container)) { throw "Compiled checkpoint directory is missing: $bin" }
          $gui = @('eglantine.exe', 'eden.exe', 'yuzu.exe') |
            ForEach-Object { Join-Path $bin $_ } |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $gui) { throw 'Downloaded checkpoint does not contain an Eden GUI executable.' }
          if (-not (Test-Path (Join-Path $bin 'COMPILED_CHECKPOINT.txt') -PathType Leaf)) {
            throw 'Downloaded artifact is not a reusable compiled checkpoint.'
          }
          Write-Host "Reusing compiled GUI: $gui"

      - name: Package portable Windows runtime
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\package-ns2-runtime.ps1"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Eden-NS2-Pokopia-Windows
          path: eden/dist/Eden-NS2-Pokopia-Windows/**
          if-no-files-found: error
          retention-days: 14
