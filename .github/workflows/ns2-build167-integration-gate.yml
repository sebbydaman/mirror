name: NS2 Build167 Full Integration Gate

on:
  workflow_dispatch:
  push:
    branches:
      - ns2-pokopia-startup-fast-win32
    paths:
      - '.github/triggers/run-build167-integration.txt'
      - '.github/workflows/ns2-build167-integration-gate.yml'
      - '.github/frontier/**'
      - '.github/experiments/**'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: ns2-build167-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build167-integration:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      EDEN_SKIP_POST_BUILD31_FRONTIER: '1'

    steps:
      - name: Checkout automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout Eglantine build167
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: e5e82c1bb0cca2ba0262cfbea0c1282b73f53fea
          path: eden
          fetch-depth: 1

      - name: Record build167 donor baseline
        shell: pwsh
        working-directory: eden
        run: |
          git rev-parse HEAD
          if (-not (Test-Path 'src/core/file_sys/nup_container.cpp')) { throw 'build167 NUP container is missing' }
          if (-not (Test-Path 'src/core/file_sys/nup_writer.cpp')) { throw 'build167 NUP writer is missing' }
          if (-not (Test-Path 'src/video_core/renderer_vulkan/vk_fsr3_upscaler.cpp')) { throw 'build167 FSR 3.1 upscaler is missing' }
          if (-not (Select-String -Path 'src/core/file_sys/nup_writer.cpp' -SimpleMatch 'CollectTree(index, entry.path(), name);' -Quiet)) { throw 'build167 NUP layout preservation fix is missing' }
          if (-not (Select-String -Path 'src/core/hle/service/nvdrv/nvdrv.cpp' -SimpleMatch 'Tegra::Nx2ClearSparseRegions();' -Quiet)) { throw 'build167 native PokeDinner-era sparse-state reset is missing' }
          if (-not (Select-String -Path 'src/video_core/vulkan_common/vulkan_device.cpp' -SimpleMatch 'EDEN_NX2_VRAM_LIMIT_MIB' -Quiet)) { throw 'build167 native VRAM-budget protection is missing' }

      - name: Apply validated base NS2 stack over build167
        shell: pwsh
        working-directory: eden
        run: |
          function Enable-Build167NativeSmallF2I {
            $path = 'src/shader_recompiler/frontend/ampere/lower_to_maxwell.h'
            $text = (Get-Content $path -Raw).Replace("`r`n", "`n")
            if ($text.Contains('const bool byte = (mode & ~0x100U) == 0x0021e000;')) { Write-Host '[PRESENT] build167 native byte/short F2I modes'; return }
            $startNeedle = '        case 0x305: case 0xb05: case 0xd05: { // F2I NTZ, register/constant-buffer/uniform source'
            $endNeedle = '        case 0xb6f:'
            $start = $text.IndexOf($startNeedle); if ($start -lt 0) { throw 'Could not locate build167 F2I start' }
            $end = $text.IndexOf($endNeedle, $start); if ($end -lt 0) { throw 'Could not locate build167 F2I end' }
            $section = $text.Substring($start, $end - $start)
            $nearest = '            const bool nearest = (mode & ~0x10100U) == 0x00203000;'
            if (-not $section.Contains($nearest)) { throw 'Could not locate build167 F2I mode classification' }
            $section = $section.Replace($nearest, $nearest + "`n" + '            // Destination size 0/1: truncate to 8/16-bit integer.' + "`n" + '            const bool byte = (mode & ~0x100U) == 0x0021e000;' + "`n" + '            const bool short_word = (mode & ~0x100U) == 0x0021e800;')
            $reject167 = '            if ((!half && !small && !floor && !nearest && (mode & ~0x10100U) != 0x0020f000) ||'
            $rejectNew = '            if ((!half && !small && !floor && !nearest && !byte && !short_word && (mode & ~0x10100U) != 0x0020f000) ||'
            if (-not $section.Contains($reject167)) { throw 'Could not locate build167 F2I rejection guard' }; $section = $section.Replace($reject167, $rejectNew)
            $oldClamp = '                if (!small) {'; if (-not $section.Contains($oldClamp)) { throw 'Could not locate build167 unsigned F2I clamp guard' }; $section = $section.Replace($oldClamp, '                if (!small && !byte && !short_word) {')
            $oldWidth = '            emit(base(0x5cb0000000000000ULL) | (u64{small ? 1U : 2U} << 8) | (u64{2} << 10) |'
            $newWidth = '            emit(base(0x5cb0000000000000ULL) | (u64{byte ? 0U : small || short_word ? 1U : 2U} << 8) | (u64{2} << 10) |'
            if (-not $section.Contains($oldWidth)) { throw 'Could not locate build167 F2I width encoding' }; $section = $section.Replace($oldWidth, $newWidth)
            $oldTail = '            if (!is_signed && !small) {'; if (-not $section.Contains($oldTail)) { throw 'Could not locate build167 unsigned F2I saturation tail' }; $section = $section.Replace($oldTail, '            if (!is_signed && !small && !byte && !short_word) {')
            $text = $text.Substring(0, $start) + $section + $text.Substring($end)
            [IO.File]::WriteAllText((Resolve-Path $path), $text, [Text.UTF8Encoding]::new($false))
            Write-Host '[APPLIED] build167 native byte/short F2I modes using modern rejection mask'
          }

          $scripts = @('apply-eglantine-integration.ps1','apply-eglantine-positive-shader-cache.ps1','apply-bananza-generic-overlap.ps1','apply-eglantine-draw-state-cache.ps1','apply-eglantine-nso-loader.ps1','apply-eglantine-nx2-memory-layout.ps1','apply-bananza-post-menu-gpu.ps1','apply-eglantine-late-runtime.ps1','apply-eglantine-handheld-mode.ps1','apply-eglantine-late-stability.ps1')
          foreach ($script in $scripts) {
            if ($script -eq 'apply-bananza-post-menu-gpu.ps1') {
              Enable-Build167NativeSmallF2I
              # Build167 already has the newer suspension-aware PR28/PR52 command-read path. Teach
              # the legacy compatibility layer to treat that native path as satisfying its older
              # gpu_written read-path patch, while still allowing the rest of the batch to apply.
              $compatPath = "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-ns2-general-compat-batch-v2.ps1"
              $compat = Get-Content $compatPath -Raw
              $oldGuard = "if (-not `$dma.Contains('const bool gpu_written = FlushGpuWrittenCommands')) {"
              $newGuard = "if (-not `$dma.Contains('const bool gpu_written = FlushGpuWrittenCommands') -and -not `$dma.Contains('command_list.snapshot_suspensions')) {"
              if (-not $compat.Contains($oldGuard)) { throw 'Could not locate legacy PR28/PR52 read-path guard' }
              $compat = $compat.Replace($oldGuard, $newGuard)
              $oldCheck = "    @(`$dmaPath, 'const bool gpu_written = FlushGpuWrittenCommands'),"
              $newCheck = "    @(`$dmaPath, 'command_list.snapshot_suspensions'),"
              if (-not $compat.Contains($oldCheck)) { throw 'Could not locate legacy PR28/PR52 regression marker' }
              $compat = $compat.Replace($oldCheck, $newCheck)
              [IO.File]::WriteAllText((Resolve-Path $compatPath), $compat, [Text.UTF8Encoding]::new($false))

              # Build167 already admits the full contiguous invocation/id range 17..19 and 29..35.
              # The older runtime-v3 patch looks for a pre-build167 explicit allow-list; mark the
              # modern range form as already satisfying that compatibility requirement.
              $runtimeV3Path = "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-ns2-runtime-blockers-v3-core.ps1"
              $runtimeV3 = Get-Content $runtimeV3Path -Raw
              $oldS2RGuard = "if (-not `$ampere.Contains('special != 17 && special != 29')) {"
              $newS2RGuard = "if (-not `$ampere.Contains('special != 17 && special != 29') -and -not `$ampere.Contains('(special < 17 || special > 19) && (special < 29 || special > 35)')) {"
              if (-not $runtimeV3.Contains($oldS2RGuard)) { throw 'Could not locate runtime-v3 S2R compatibility guard' }
              $runtimeV3 = $runtimeV3.Replace($oldS2RGuard, $newS2RGuard)
              [IO.File]::WriteAllText((Resolve-Path $runtimeV3Path), $runtimeV3, [Text.UTF8Encoding]::new($false))
            }
            Write-Host "[BUILD167 BASE] $script"
            & "$env:GITHUB_WORKSPACE\automation\.github\scripts\$script"
          }
          git diff --check

      - name: Apply custom final NS2 performance stack over build167
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          git diff --check

      - name: Verify build167 features survived custom stack
        shell: pwsh
        working-directory: eden
        run: |
          if (-not (Test-Path 'src/core/file_sys/nup_container.cpp')) { throw 'NUP container disappeared after custom stack' }
          if (-not (Test-Path 'src/core/file_sys/nup_writer.cpp')) { throw 'NUP writer disappeared after custom stack' }
          if (-not (Test-Path 'src/video_core/renderer_vulkan/vk_fsr3_upscaler.cpp')) { throw 'FSR 3.1 disappeared after custom stack' }
          if (-not (Select-String -Path 'src/core/file_sys/nup_writer.cpp' -SimpleMatch 'CollectTree(index, entry.path(), name);' -Quiet)) { throw 'NUP folder-layout preservation was regressed by custom stack' }
          if (-not (Select-String -Path 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' -SimpleMatch 'CreateGraphicsPipeline(main_pools, graphics_key, environments.Span(), nullptr, true)' -Quiet)) { throw 'build167 async native pipeline handoff was regressed by custom stack' }
          if (-not (Select-String -Path 'src/video_core/shader_environment.cpp' -SimpleMatch 'native_shader_positive_cache_mutex' -Quiet)) { throw 'build167 positive native shader cache disappeared' }
          git diff --check

      - name: Run custom source regression checks
        shell: pwsh
        working-directory: eden
        run: |
          $tests = @("$env:GITHUB_WORKSPACE\automation\.github\frontier\test-build158-map-in-order.ps1","$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-regressions.ps1","$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-late-regressions.ps1","$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-stability-regressions.ps1")
          foreach ($test in $tests) { if (Test-Path $test -PathType Leaf) { & $test } }
          git diff --check

      - name: Set up MSYS2 clang toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p lerc:p graphite2:p libwebp:p libtiff:p brotli:p

      - name: Configure build167 + final stack
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake -S . -B build-build167 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DYUZU_TESTS=ON -DYUZU_CMD=OFF -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON -DYUZU_USE_BUNDLED_FFMPEG=ON -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF -DENABLE_WERROR=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld

      - name: Build full GUI plus tests
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake --build build-build167 --target yuzu tests --parallel 4

      - name: Run NUP tests
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          testbin=''
          while IFS= read -r candidate; do case "$candidate" in *tests.exe|*tests) testbin="$candidate"; break ;; esac; done < <(find build-build167 -type f \( -name 'tests.exe' -o -name 'tests' \) -print)
          [ -n "$testbin" ] || { echo 'Could not locate tests binary' >&2; exit 1; }
          "$testbin" '[nup]' --reporter compact

      - name: Upload build167 compiler/log checkpoint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build167-integration-checkpoint-${{ github.sha }}
          path: |
            eden/build-build167/CMakeCache.txt
            eden/build-build167/bin/**
          if-no-files-found: warn
          retention-days: 7
