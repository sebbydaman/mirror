name: Orchid Unified Independent Donor Gates

on:
  workflow_dispatch:
  push:
    branches:
      - ns2-orchid-unified-20261104
    paths:
      - '.github/workflows/ns2-unified-independent-donors.yml'
      - '.github/triggers/run-orchid-independent-donors.txt'

permissions:
  contents: read

concurrency:
  group: ns2-unified-independent-donors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  donor:
    name: "${{ matrix.candidate }} C++ gate"
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate: [taskmesh, mkw, starfox, pipelines]
    steps:
      - name: Checkout integration controls
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout exact Orchid source
        uses: actions/checkout@v5
        with:
          repository: MythosOfs/Orchid
          ref: d858fc90683ec55ecca9321081e719e02acbfd28
          path: eden
          fetch-depth: 1

      - name: Apply existing compiled source integration
        shell: pwsh
        working-directory: eden
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne 'd858fc90683ec55ecca9321081e719e02acbfd28') { throw "Wrong Orchid source: $sha" }
          & "$env:GITHUB_WORKSPACE\automation\.github\unified\apply-verified-source-ports.ps1"
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Existing integration invalid' }

      - name: Set up MSYS2 Clang for isolated C++ gates
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p

      - name: Configure one reusable C++ gate build (no PGO, no GUI)
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake -S . -B build-gates -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            '-DCMAKE_C_FLAGS=-mtune=znver4' \
            '-DCMAKE_CXX_FLAGS=-mtune=znver4'

      - name: Apply only the selected donor and check idempotence
        shell: pwsh
        working-directory: eden
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          $names = @{
            taskmesh = 'apply-native-taskmesh-stage-buffer.ps1'
            mkw = 'apply-pokedinner-mkw-fps.ps1'
            starfox = 'apply-lichii-streamplay-hid.ps1'
            pipelines = 'apply-lichii-inline-pipeline-builds.ps1'
          }
          $script = Join-Path "$env:GITHUB_WORKSPACE\automation\.github\unified\experiments" $names[$env:CANDIDATE]
          if (-not (Test-Path $script)) { throw "Missing candidate: $env:CANDIDATE" }
          & $script
          & $script
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Candidate $env:CANDIDATE produced invalid source" }
          git diff --stat | Out-File -FilePath "donor-${{ matrix.candidate }}-stat.txt" -Encoding utf8

      - name: Compile isolated donor target
        shell: msys2 {0}
        working-directory: eden
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set +e
          case "$CANDIDATE" in
            taskmesh) target=shader_recompiler ;;
            mkw|starfox) target=core ;;
            pipelines) target=video_core ;;
            *) echo "unknown candidate $CANDIDATE" >&2; exit 2 ;;
          esac
          cmake --build build-gates --target "$target" --parallel 4 --verbose 2>&1 | tee "donor-$CANDIDATE.log"
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"

      - name: Capture exact candidate source diff
        if: always()
        shell: pwsh
        working-directory: eden
        run: |
          git diff --check
          git diff --stat | Out-File -FilePath donor-${{ matrix.candidate }}-stat.txt -Encoding utf8
          git diff | Out-File -FilePath donor-${{ matrix.candidate }}-source.diff -Encoding utf8

      - name: Upload compile result and source diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: donor-${{ matrix.candidate }}-preflight-${{ github.sha }}
          path: |
            eden/donor-${{ matrix.candidate }}.log
            eden/donor-${{ matrix.candidate }}-stat.txt
            eden/donor-${{ matrix.candidate }}-source.diff
          retention-days: 14
          if-no-files-found: warn
