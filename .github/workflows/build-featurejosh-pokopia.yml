name: Build featureJosh Pokopia latest

on:
  push:
    branches:
      - build-pokopia-featurejosh-latest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: cd6b79f893f2e11c409d1420c08bd83364aa3d71
    steps:
      - name: Checkout exact newest featureJosh source
        shell: pwsh
        run: |
          git clone https://github.com/featureJosh/pokopia-recomp.git pokopia-src
          if ($LASTEXITCODE) { throw "git clone failed ($LASTEXITCODE)" }
          git -C pokopia-src checkout $env:SOURCE_SHA
          if ($LASTEXITCODE) { throw "git checkout failed ($LASTEXITCODE)" }
          $actual = (git -C pokopia-src rev-parse HEAD).Trim()
          if ($actual -ne $env:SOURCE_SHA) { throw "Wrong source commit: $actual" }
          Write-Host "Building featureJosh/pokopia-recomp $actual"

      - name: Prepare vcpkg libvpx
        shell: pwsh
        run: |
          $vcpkg = 'C:\vcpkg'
          if (-not (Test-Path "$vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkg
            if ($LASTEXITCODE) { throw "vcpkg clone failed ($LASTEXITCODE)" }
            & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE) { throw "vcpkg bootstrap failed ($LASTEXITCODE)" }
          }
          & "$vcpkg\vcpkg.exe" install libvpx:x64-windows-static --clean-after-build
          if ($LASTEXITCODE) { throw "libvpx build failed ($LASTEXITCODE)" }

      - name: Build ASTC texture support
        shell: pwsh
        run: |
          & pwsh -NoProfile -File "$PWD\pokopia-src\tools\textures\scripts\fetch_third_party.ps1"
          if ($LASTEXITCODE) { throw "texture dependency fetch failed ($LASTEXITCODE)" }
          & pwsh -NoProfile -File "$PWD\pokopia-src\tools\textures\scripts\build.ps1"
          if ($LASTEXITCODE) { throw "texture build failed ($LASTEXITCODE)" }

      - name: Build newest pkp_rt.dll
        shell: cmd
        run: |
          call pokopia-src\runtime\scripts\env.cmd
          cmake -S pokopia-src\game-build -B pokopia-src\game-build\build\rt-latest -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DPKP_RT_DLL=ON -DPKP_VERSION=0.1.1-featureJosh-cd6b79f -DNXRT_LIBVPX_ROOT=C:\vcpkg\installed\x64-windows-static
          if errorlevel 1 exit /b %errorlevel%
          cmake --build pokopia-src\game-build\build\rt-latest --target pkp_rt --parallel
          if errorlevel 1 exit /b %errorlevel%

      - name: Stage newest runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force latest-runtime | Out-Null
          $dll = Get-ChildItem pokopia-src\game-build\build\rt-latest -Recurse -Filter pkp_rt.dll | Select-Object -First 1
          $lib = Get-ChildItem pokopia-src\game-build\build\rt-latest -Recurse -Filter pkp_rt.lib | Select-Object -First 1
          if (-not $dll) { throw 'pkp_rt.dll not found' }
          if (-not $lib) { throw 'pkp_rt.lib not found' }
          Copy-Item $dll.FullName latest-runtime\pkp_rt.dll
          Copy-Item $lib.FullName latest-runtime\pkp_rt.lib
          $env:SOURCE_SHA | Set-Content latest-runtime\SOURCE_SHA.txt
          Get-FileHash latest-runtime\pkp_rt.dll -Algorithm SHA256 | Format-List

      - name: Upload newest runtime
        uses: actions/upload-artifact@v4
        with:
          name: PokopiaRuntime-featureJosh-cd6b79f
          path: latest-runtime
          if-no-files-found: error
          compression-level: 0
