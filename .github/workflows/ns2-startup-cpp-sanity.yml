name: Sanity Eden NS2 Startup Win32 C++

on:
  workflow_dispatch:
  push:
    branches:
      - ns2-pokopia-startup-fast-win32
    paths:
      - '.github/workflows/ns2-startup-cpp-sanity.yml'
      - '.github/experiments/apply-windows-romfs-enumeration-fastpath.ps1'
      - '.github/experiments/apply-loose-romfs-memoization.ps1'
      - '.github/experiments/apply-golden-hostmem-toggle.ps1'
      - '.github/frontier/**'

permissions:
  contents: read

concurrency:
  group: ns2-startup-cpp-sanity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-cpp-sanity:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      EDEN_SKIP_POST_BUILD31_FRONTIER: '1'

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Apply validated base NS2 stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"

      - name: Apply exact final performance stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Final performance stack failed to apply' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Combined stack failed git diff --check' }

      - name: Set up MSYS2 Clang sanity toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p

      - name: Configure compile-only sanity build
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake -S . -B build-startup-sanity -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            '-DCMAKE_C_FLAGS=-mtune=znver4' \
            '-DCMAKE_CXX_FLAGS=-mtune=znver4'

      - name: Compile startup and golden-memory translation units
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          ninja -C build-startup-sanity -t targets all > startup-sanity-targets.txt
          mapfile -t targets < <(sed 's/: .*//' startup-sanity-targets.txt | grep -E '(^|/)vfs_real\.cpp\.(o|obj)$|(^|/)fsmitm_romfsbuild\.cpp\.(o|obj)$|(^|/)host_memory\.cpp\.(o|obj)$' || true)
          printf 'Matched startup/golden-memory sanity targets:\n%s\n' "${targets[*]:-<none>}"
          if [ "${#targets[@]}" -ne 3 ]; then
            echo "Expected exactly three startup/golden-memory translation-unit targets, found ${#targets[@]}" >&2
            grep -E 'vfs_real|fsmitm_romfsbuild|host_memory' startup-sanity-targets.txt || true
            exit 1
          fi
          for target in "${targets[@]}"; do
            echo "Compiling $target"
            ninja -C build-startup-sanity "$target"
          done
          echo '[PASS] Win32 RomFS/VFS + golden HostMemory toggle compile with the production Clang family.'

      - name: Upload sanity diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-cpp-sanity-${{ github.sha }}
          path: eden/startup-sanity-targets.txt
          if-no-files-found: warn
          retention-days: 3
