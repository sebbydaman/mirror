name: Orchid Star Fox Gradient Windows C++ Gate
on:
  workflow_dispatch:
  push:
    branches: [ns2-orchid-unified-20261104]
    paths: ['.github/workflows/ns2-starfox-gradient-gate.yml']
permissions:
  contents: read
concurrency:
  group: ns2-orchid-starfox-gradient-gate
  cancel-in-progress: false
jobs:
  starfox-gradient:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1
      - name: Checkout exact Orchid v0.7.0
        uses: actions/checkout@v5
        with:
          repository: MythosOfs/Orchid
          ref: d858fc90683ec55ecca9321081e719e02acbfd28
          path: eden
          fetch-depth: 1
      - name: Check source application and idempotence first
        shell: pwsh
        working-directory: eden
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne 'd858fc90683ec55ecca9321081e719e02acbfd28') { throw "Unexpected base $sha" }
          $root = "$env:GITHUB_WORKSPACE\automation\.github\unified"
          & "$root\apply-verified-source-ports.ps1"
          & "$root\apply-combined-four-donors.ps1"
          $fix = "$root\repairs\apply-starfox-gradient.ps1"
          & $fix
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Source diff failed' }
          $before = (git diff --binary | Out-String)
          & $fix
          $after = (git diff --binary | Out-String)
          if ($before -cne $after) { throw 'Star Fox patch is not idempotent' }
          foreach ($part in @('case 0xf6c:', 'case 0x923: case 0x927:', 'op == 0xf60 || op == 0xf6c')) {
            if (-not (Select-String -Path 'src/shader_recompiler/frontend/ampere/lower_to_maxwell.h' -Pattern $part -SimpleMatch -Quiet)) { throw "Missing $part" }
          }
          git diff --stat
      - name: Set up MSYS2 clang
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p
      - name: Configure targeted C++ gate
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake -S . -B build-gates -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            '-DCMAKE_C_FLAGS=-mtune=znver4' \
            '-DCMAKE_CXX_FLAGS=-mtune=znver4'
      - name: Compile shader recompiler and core
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -o pipefail
          set +e
          cmake --build build-gates --target shader_recompiler core --parallel 4 --verbose 2>&1 | tee starfox-gradient-cpp.log
          code=$?
          set -e
          grep -n -m1 -E 'fatal error:| error:|undefined reference|FAILED:' starfox-gradient-cpp.log > first-error.txt || true
          exit "$code"
      - name: Save focused compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: starfox-gradient-cpp-results
          path: |
            eden/starfox-gradient-cpp.log
            eden/first-error.txt
          retention-days: 14
          if-no-files-found: warn
