name: NS2 pipeline and donor diagnostic

on:
  push:
    branches:
      - ns2-pokopia-startup-fast-win32
    paths:
      - '.github/workflows/ns2-pipeline-skip-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns2-pipeline-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-assembled-source:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      EDEN_SKIP_POST_BUILD31_FRONTIER: '1'

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout pinned Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Apply validated base NS2 stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"

      - name: Apply exact final performance stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Final performance stack failed to apply' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Combined stack failed git diff --check' }

      - name: Inspect exact assembled Pokopia source
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'pokopia-donor-diagnostic.txt'
          function Emit([string]$text = '') { $text | Tee-Object -FilePath $out -Append }
          function Scan([string]$title, [string[]]$patterns) {
            Emit "`n===== $title ====="
            foreach ($pattern in $patterns) {
              Emit "--- $pattern ---"
              git grep -n -I -E $pattern -- src/video_core src/shader_recompiler 2>$null | Select-Object -First 80 | ForEach-Object { Emit $_ }
              if ($LASTEXITCODE -gt 1) { throw "git grep failed for $pattern" }
            }
          }
          Emit "Base=f362528c0447c491bfe00c0bdd5d8c245396a24c automation=$env:GITHUB_SHA"
          Scan 'Async translation / draw skip' @('CanSkipDraw','WaitForGraphicsTranslation','QueueGraphicsTranslation','EDEN_NX2_TRANSLATION_WORKERS','reuse_rejects')
          Scan 'Task mesh opcode and stage buffers' @('0x927','ISBEWR','StageBuffer|stage_buffer','Task|Mesh')
          Scan 'Selevet synchronization candidates' @('EDEN_NX2_CMD_BATCH','BeginDownloadBatch|EndDownloadBatch','EDEN_NX2_ACQUIRE_QUEUED','NoteQueuedRelease','QMD_ACQUIRE_SKIP')
          Scan 'Submission policy' @('4096','submit_threshold|submission_threshold|draw_threshold','FlushCommands')
          Scan 'Reuse and snapshots' @('MaxVariants','Detach\(','SnapshotSizeBytes','NativeInstructionReader','LoweredNative','ReadBlockUnsafe')
          git diff --check

      - name: Upload assembled-source diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pokopia-donor-diagnostic-${{ github.sha }}
          path: eden/pokopia-donor-diagnostic.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Confirm protected refs untouched
        shell: pwsh
        run: Write-Host 'Diagnostic only; protected golden and final-perf refs untouched.'
