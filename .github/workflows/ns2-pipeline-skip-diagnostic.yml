name: NS2 pipeline and donor diagnostic

on:
  push:
    branches:
      - ns2-pokopia-startup-fast-win32
    paths:
      - '.github/workflows/ns2-pipeline-skip-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns2-pipeline-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-assembled-source:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      EDEN_SKIP_POST_BUILD31_FRONTIER: '1'

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout pinned Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Apply validated base NS2 stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"

      - name: Apply exact final performance stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Final performance stack failed to apply' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Combined stack failed git diff --check' }

      - name: Inspect exact assembled Pokopia source
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          # A git-grep no-match is an expected diagnostic result, not a workflow failure.
          $PSNativeCommandUseErrorActionPreference = $false
          $out = Join-Path $PWD 'pokopia-donor-diagnostic.txt'
          function Emit([string]$text = '') { $text | Tee-Object -FilePath $out -Append }
          function Scan([string]$title, [string[]]$patterns) {
            Emit "`n===== $title ====="
            foreach ($pattern in $patterns) {
              Emit "--- $pattern ---"
              $matches = @(git grep -n -I -E $pattern -- src/video_core src/shader_recompiler 2>$null)
              $code = $LASTEXITCODE
              if ($code -gt 1) { throw "git grep failed for $pattern with exit code $code" }
              if ($matches.Count -eq 0) {
                Emit '[NO MATCH]'
              } else {
                $matches | Select-Object -First 80 | ForEach-Object { Emit $_ }
              }
            }
          }
          function Context([string]$path, [int]$start, [int]$end) {
            Emit "`n===== CONTEXT ${path}:$start-$end ====="
            if (-not (Test-Path $path -PathType Leaf)) {
              Emit '[MISSING FILE]'
              return
            }
            $lines = Get-Content $path
            $lo = [Math]::Max(1, $start)
            $hi = [Math]::Min($end, $lines.Count)
            for ($i = $lo; $i -le $hi; $i++) {
              Emit ("{0}:{1}:{2}" -f $path, $i, $lines[$i - 1])
            }
          }
          function FunctionContext([string]$path, [string]$pattern, [int]$before = 8, [int]$after = 80) {
            Emit "`n===== FUNCTION $pattern in $path ====="
            if (-not (Test-Path $path -PathType Leaf)) {
              Emit '[MISSING FILE]'
              return
            }
            $hits = @(Select-String -Path $path -Pattern $pattern)
            if ($hits.Count -eq 0) {
              Emit '[NO MATCH]'
              return
            }
            foreach ($hit in ($hits | Select-Object -First 3)) {
              Context $path ($hit.LineNumber - $before) ($hit.LineNumber + $after)
            }
          }
          Emit "Base=f362528c0447c491bfe00c0bdd5d8c245396a24c automation=$env:GITHUB_SHA"
          Scan 'Async translation / draw skip' @('CanSkipDraw','CurrentGraphicsPipelineSlowPath','WaitForGraphicsTranslation','QueueGraphicsTranslation','AdoptTranslatedGraphicsPipelines','EDEN_NX2_TRANSLATION_WORKERS','reuse_rejects')
          Scan 'Task mesh opcode and stage buffers' @('0x923|0x927','ISBERD|ISBEWR|ISBE_nx2','IsbeRead|IsbeWrite|EmitIsbe','StageBuffer|stage_buffer','MeshPrologue|MeshEpilogue|EmitMeshTasks|SetMeshOutputs','Task|Mesh')
          Scan 'Selevet synchronization candidates' @('EDEN_NX2_CMD_BATCH','BeginDownloadBatch|EndDownloadBatch','EDEN_NX2_ACQUIRE_QUEUED','NoteQueuedRelease','QMD_ACQUIRE_SKIP')
          Scan 'Submission policy' @('DRAWS_TO_DISPATCH','4096','submit_threshold|submission_threshold|draw_threshold','FlushCommands')
          Scan 'Cache restore and prewarm' @('pipeline_cache_filename','LoadDiskResources','LoadPipelines','CACHE_VERSION','Total Pipeline Count','SerializePipeline','vulkan_static_pipelines','StaticPipeline|static_pipeline')
          Scan 'Reuse and snapshots' @('MaxVariants','Detach\(','SnapshotSizeBytes','NativeInstructionReader','LoweredNative','ReadBlockUnsafe')

          FunctionContext 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' 'PipelineCache::CurrentGraphicsPipelineSlowPath' 10 70
          FunctionContext 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' 'PipelineCache::CanSkipDraw' 10 55
          FunctionContext 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' 'PipelineCache::QueueGraphicsTranslation' 10 70
          FunctionContext 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' 'PipelineCache::WaitForGraphicsTranslation' 10 55
          FunctionContext 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' 'PipelineCache::AdoptTranslatedGraphicsPipelines' 10 70
          FunctionContext 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' 'PipelineCache::LoadDiskResources' 12 140
          FunctionContext 'src/video_core/shader_environment.cpp' '^void LoadPipelines' 12 110
          FunctionContext 'src/video_core/shader_environment.cpp' '^void SerializePipeline' 12 90
          FunctionContext 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' 'pipeline_cache_filename = ' 15 40
          FunctionContext 'src/video_core/renderer_vulkan/vk_pipeline_cache.cpp' 'constexpr u32 CACHE_VERSION' 5 15

          # Build-142 task/mesh donor audit: dump the connected feature, not merely the 0x927 token.
          FunctionContext 'src/shader_recompiler/frontend/ampere/lower_to_maxwell.h' 'case 0x923|case 0x927' 14 65
          FunctionContext 'src/shader_recompiler/frontend/maxwell/maxwell.inc' 'ISBERD|ISBE_nx2' 6 12
          FunctionContext 'src/shader_recompiler/frontend/maxwell/translate/impl/internal_stage_buffer_entry_read.cpp' 'TranslatorVisitor::ISBERD|TranslatorVisitor::ISBE_nx2' 10 120
          FunctionContext 'src/shader_recompiler/frontend/maxwell/translate_program.cpp' 'ISBE_nx2|ISBERD' 8 28
          FunctionContext 'src/shader_recompiler/frontend/ir/ir_emitter.h' 'IsbeRead|IsbeWrite' 8 30
          FunctionContext 'src/shader_recompiler/frontend/ir/ir_emitter.cpp' 'IREmitter::IsbeRead|IREmitter::IsbeWrite' 8 45
          FunctionContext 'src/shader_recompiler/frontend/ir/opcodes.inc' 'IsbeRead|IsbeWrite' 8 20
          FunctionContext 'src/shader_recompiler/backend/spirv/emit_spirv_mesh.cpp' 'EmitIsbeRead|EmitIsbeWrite|EmitMeshPrologue|EmitMeshEpilogue' 10 90
          FunctionContext 'src/shader_recompiler/backend/spirv/emit_spirv.cpp' 'PatchMeshInstructions|ExecutionModel::TaskEXT|ExecutionModel::MeshEXT' 10 55

          Context 'src/video_core/renderer_vulkan/vk_rasterizer.cpp' 1065 1100
          Context 'src/video_core/renderer_vulkan/vk_rasterizer.cpp' 1450 1490
          Context 'src/video_core/buffer_cache/buffer_cache.h' 2125 2185
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Assembled diagnostic source failed git diff --check' }

      - name: Upload assembled-source diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pokopia-donor-diagnostic-${{ github.sha }}
          path: eden/pokopia-donor-diagnostic.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Confirm protected refs untouched
        shell: pwsh
        run: Write-Host 'Diagnostic only; protected golden and final-perf refs untouched.'
