# Diagnostic-only donor applicability probe. Production stack must remain behind timing/shader gates.
name: NS2 build142 task-mesh donor probe

on:
  push:
    branches:
      - ns2-pokopia-startup-fast-win32
    paths:
      - '.github/workflows/ns2-build142-taskmesh-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns2-build142-taskmesh-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-donor:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      EDEN_SKIP_POST_BUILD31_FRONTIER: '1'
    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout pinned Eglantine source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Assemble exact current Pokopia stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Current assembled stack failed diff check' }

      - name: Probe coherent build142 task-mesh donor chain
        shell: pwsh
        working-directory: eden
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $report = Join-Path $env:RUNNER_TEMP 'build142-taskmesh-probe.txt'
          if (Test-Path $report) { Remove-Item $report -Force }
          function Emit([string]$text = '') { $text | Tee-Object -FilePath $report -Append }
          Emit "automation=$env:GITHUB_SHA"
          Emit 'Donor 1: eb02d1dd53a03d0bb6ce541694243579a4c10c6f'
          Emit 'Donor 2: 310dd596d0f6d48de3517cfb1bdc90a366817405'

          git add -A
          if (git status --porcelain) {
            git -c user.name='Eden NS2 CI' -c user.email='actions@github.com' commit -m 'CI checkpoint exact assembled stack before build142 task-mesh probe' --no-verify
            if ($LASTEXITCODE -ne 0) { throw 'Could not checkpoint assembled source' }
          }
          $checkpoint = (git rev-parse HEAD).Trim()
          Emit "checkpoint=$checkpoint"

          if (-not (git remote | Select-String -SimpleMatch 'eglantine-taskmesh')) {
            git remote add eglantine-taskmesh https://github.com/Djihads80/Eglantine.git
          }
          git fetch --no-tags --depth=8 eglantine-taskmesh eb02d1dd53a03d0bb6ce541694243579a4c10c6f 310dd596d0f6d48de3517cfb1bdc90a366817405
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch build142 task-mesh donor commits' }

          $amperePath = 'src/shader_recompiler/frontend/ampere/lower_to_maxwell.h'
          $ampere = (Get-Content $amperePath -Raw).Replace("`r`n", "`n")
          Emit "`n===== manual semantic resolution of eb02d1dd lowerer conflict ====="

          if (-not [regex]::IsMatch($ampere, '\bcase\s+0x2bf\s*:')) {
            $anchor = '        case 0x3a1:'
            if (-not $ampere.Contains($anchor)) { throw 'UPOPC insertion anchor changed' }
            $upopc = @'
                  case 0x2bf: // UPOPC, as POPC of the uniform's register.
                      if (dest >= 16 || insn.words[1] >= 16 || insn.words[2] != 0x08000000 || native_predicate != 7)
                          return fail(index, "native uniform population count mode");
                      emit(0x5c08000000000000ULL | predicate | (dest + 216) | (u64{insn.words[1] + 216} << 20));
                      break;
          '@
            $upopc = ($upopc -split "`n" | ForEach-Object { if ($_.Length -ge 10) { $_.Substring(10) } else { $_ } }) -join "`n"
            $ampere = $ampere.Replace($anchor, $upopc.TrimEnd("`r", "`n") + "`n" + $anchor)
            Emit 'Added donor UPOPC lowering.'
          } else {
            Emit 'UPOPC lowering already present.'
          }

          $oldPattern = '(?s)        case 0x923: \{ // ISBERD indexed task/mesh attribute read / direct map read\..*?        case 0x34e: \{ // LEPC:'
          $match = [regex]::Match($ampere, $oldPattern)
          if (-not $match.Success) { throw 'Could not locate current custom ISBERD/ISBEWR pair' }
          $isbe = @'
                  case 0x923: case 0x927: { // ISBERD / ISBEWR: task and mesh programs' stage buffer.
                      // Ampere: Ra 24-31, offset 40-63, ISBERD dest 16-23, ISBEWR data 32-39; 75 = .32 (else
                      // U8), 76-77 = 3 .ATTR (0 the map region), 78 = .SKEW, 79 = .O (the output buffer).
                      // Kept as an nx2 pseudo instruction (Maxwell 0xefc0, free there) that the frontend
                      // reads for the task or mesh stage: data/dest 0-7, Ra 8-15, offset 20-43, .32 44,
                      // .ATTR 45, .SKEW 46, .O 47, write 48. Addresses are linear bytes in the region.
                      const bool write = opcode == 0x927;
                      const u32 region = insn.Bits(76, 2);
                      const bool output = insn.Bits(79, 1) != 0;
                      if ((insn.words[2] & ~0xf800U) != 0 || (region != 0 && region != 3) || write != output ||
                          (!write && region != 3) || (!write && dest == 255))
                          return fail(index, "native stage buffer access mode");
                      emit(0xefc0000000000000ULL | predicate | (write ? u64{insn.Bits(32, 8)} : dest) |
                           (u64{insn.Bits(24, 8)} << 8) | (u64{insn.Bits(40, 24)} << 20) |
                           (u64{insn.Bits(75, 1)} << 44) | (u64{region == 3} << 45) |
                           (u64{insn.Bits(78, 1)} << 46) | (u64{output} << 47) | (u64{write} << 48));
                      break;
                  }
                  case 0x34e: { // LEPC:
          '@
          $isbe = ($isbe -split "`n" | ForEach-Object { if ($_.Length -ge 10) { $_.Substring(10) } else { $_ } }) -join "`n"
          $ampere = [regex]::Replace($ampere, $oldPattern, $isbe.TrimEnd("`r", "`n"), 1)
          [IO.File]::WriteAllText((Resolve-Path $amperePath).Path, $ampere.TrimEnd("`r", "`n") + "`n", [Text.UTF8Encoding]::new($false))
          Emit 'Replaced narrow direct ISBE lowering with donor 0xefc0 pseudo-op semantics.'
          foreach ($needle in @('case 0x923: case 0x927:', '0xefc0000000000000ULL', '(region != 0 && region != 3)', 'case 0x2bf:')) {
            if (-not ((Get-Content $amperePath -Raw).Contains($needle))) { throw "Manual donor-1 semantic resolution missing $needle" }
          }
          git diff --check -- $amperePath
          if ($LASTEXITCODE -ne 0) { throw 'Manual donor-1 semantic resolution failed diff check' }
          git add $amperePath
          git -c user.name='Eden NS2 CI' -c user.email='actions@github.com' commit -m 'Probe: resolve build142 ISBE lowering over current Pokopia lowerer' --no-verify
          if ($LASTEXITCODE -ne 0) { throw 'Could not checkpoint manual donor-1 semantics' }
          $resolvedFirst = (git rev-parse HEAD).Trim()
          Emit "resolved_first=$resolvedFirst"

          Emit "`n===== cherry-pick --no-commit 310dd596d0f6d48de3517cfb1bdc90a366817405 ====="
          git cherry-pick --no-commit 310dd596d0f6d48de3517cfb1bdc90a366817405 2>&1 | ForEach-Object { Emit $_ }
          $code = $LASTEXITCODE
          Emit "exit=$code"
          $clean = $code -eq 0
          if (-not $clean) {
            Emit '--- conflicts ---'
            @(git diff --name-only --diff-filter=U) | ForEach-Object { Emit $_ }
            Emit '--- status ---'
            git status --short | ForEach-Object { Emit $_ }
          } else {
            Emit '--- final donor diff stat ---'
            git diff --stat $resolvedFirst | ForEach-Object { Emit $_ }
            Emit '--- required connected symbols ---'
            foreach ($pattern in @('ISBE_nx2','IsbeRead','IsbeWriteMapU32','EmitMeshPrologue','ExecutionModel::TaskEXT','ExecutionModel::MeshEXT')) {
              Emit "[$pattern]"
              $hits = @(git grep -n -I $pattern -- src/shader_recompiler src/video_core 2>$null)
              if ($hits.Count) { $hits | Select-Object -First 20 | ForEach-Object { Emit $_ } } else { Emit '[NO MATCH]' }
            }
            git diff --check
            Emit "diff_check_exit=$LASTEXITCODE"
          }
          Emit "clean_second=$clean"

          git reset --hard $checkpoint | Out-Null
          git clean -fd | Out-Null
          Emit 'Probe complete; ephemeral source reset to checkpoint.'

      - name: Upload donor probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build142-taskmesh-probe-${{ github.sha }}
          path: ${{ runner.temp }}/build142-taskmesh-probe.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Confirm protected refs untouched
        shell: pwsh
        run: Write-Host 'Diagnostic probe only; golden refs untouched.'
