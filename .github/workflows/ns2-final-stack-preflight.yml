name: Preflight Eden NS2 Final Performance Stack

on:
  workflow_dispatch:
  push:
    branches:
      - ns2-pokopia-final-perf
    paths:
      - '.github/workflows/ns2-final-stack-preflight.yml'
      - '.github/frontier/**'
      - '.github/experiments/**'
      - '.github/scripts/test-ns2-regressions.ps1'
      - '.github/scripts/test-pokedinner-performance.ps1'
      - '.github/scripts/test-ns2-late-regressions.ps1'
      - '.github/scripts/test-ns2-stability-regressions.ps1'

permissions:
  contents: read

concurrency:
  group: ns2-final-stack-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout Eglantine NS2 source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Apply validated base NS2 stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"

      - name: Apply canonical final NS2 performance stack
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Final performance stack failed to apply' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Combined performance stack failed git diff --check' }
          Write-Host '[PASS] Canonical final performance stack applied cleanly.'

      - name: Regression 01 core NS2
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-regressions.ps1"'

      - name: Regression 02 PokeDinner performance
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-pokedinner-performance.ps1"'

      - name: Regression 03 late NS2
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-late-regressions.ps1"'

      - name: Regression 04 stability
        shell: pwsh
        working-directory: eden
        run: '& "$env:GITHUB_WORKSPACE\automation\.github\scripts\test-ns2-stability-regressions.ps1"'
