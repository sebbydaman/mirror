name: NS2 build142 runtime donor compile gate

on:
  workflow_dispatch:
  push:
    branches:
      - ns2-pokopia-startup-fast-win32
    paths:
      - '.github/workflows/ns2-build142-runtime-compile.yml'
      - '.github/frontier/apply-build142-runtime.ps1'
      - '.github/frontier/build142-runtime.patch'
      - '.github/frontier/test-build142-runtime.ps1'

permissions:
  contents: read

concurrency:
  group: ns2-build142-runtime-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-runtime:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      EDEN_SKIP_POST_BUILD31_FRONTIER: '1'

    steps:
      - name: Checkout build automation
        uses: actions/checkout@v5
        with:
          path: automation
          fetch-depth: 1

      - name: Checkout pinned Eglantine source
        uses: actions/checkout@v5
        with:
          repository: Djihads80/Eglantine
          ref: f362528c0447c491bfe00c0bdd5d8c245396a24c
          path: eden
          fetch-depth: 1

      - name: Assemble canonical stack plus isolated runtime donor
        shell: pwsh
        working-directory: eden
        run: |
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-integration.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-positive-shader-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-generic-overlap.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-draw-state-cache.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nso-loader.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-nx2-memory-layout.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-bananza-post-menu-gpu.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-runtime.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-handheld-mode.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\scripts\apply-eglantine-late-stability.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-final-performance-stack.ps1"
          & "$env:GITHUB_WORKSPACE\automation\.github\frontier\apply-build142-runtime.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Build142 runtime donor failed to assemble' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Build142 runtime compile tree failed diff check' }

      - name: Set up MSYS2 Clang runtime-donor toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p

      - name: Configure runtime-donor compile gate
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          cmake -S . -B build-runtime-sanity -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DYUZU_TESTS=OFF -DYUZU_CMD=OFF \
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF -DUSE_DISCORD_PRESENCE=OFF \
            -DENABLE_WEB_SERVICE=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            '-DCMAKE_C_FLAGS=-mtune=znver4' \
            '-DCMAKE_CXX_FLAGS=-mtune=znver4'

      - name: Compile runtime-donor translation units
        shell: msys2 {0}
        working-directory: eden
        run: |
          set -euo pipefail
          ninja -C build-runtime-sanity -t targets all > runtime-sanity-targets.txt
          mapfile -t targets < <(sed 's/: .*//' runtime-sanity-targets.txt | grep -E '(^|/)(dma_pusher|gpu_split|vk_buffer_cache|gl_buffer_cache|vk_compute_pass|vk_texture_cache|vk_rasterizer|gl_rasterizer)\.cpp\.(o|obj)$' || true)
          printf 'Matched build142 runtime-donor targets:\n%s\n' "${targets[*]:-<none>}"
          if [ "${#targets[@]}" -ne 8 ]; then
            echo "Expected exactly eight build142 runtime-donor translation-unit targets, found ${#targets[@]}" >&2
            grep -E 'dma_pusher|gpu_split|buffer_cache|vk_compute_pass|vk_texture_cache|rasterizer' runtime-sanity-targets.txt || true
            exit 1
          fi
          for target in "${targets[@]}"; do
            echo "Compiling $target"
            ninja -C build-runtime-sanity "$target"
          done
          echo '[PASS] Isolated Build142 runtime donor compiles across DMA/split, Vulkan/OpenGL buffer-cache/rasterizer, ASTC and texture-cache units.'

      - name: Upload runtime-donor compile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build142-runtime-compile-${{ github.sha }}
          path: eden/runtime-sanity-targets.txt
          if-no-files-found: warn
          retention-days: 5
