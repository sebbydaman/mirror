name: Publish Eden NS2 Final Release

on:
  workflow_run:
    workflows:
      - Build Eden NS2 Final Zen4 PGO
    types:
      - completed
    branches:
      - ns2-pokopia-final-perf
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2025
    steps:
      - name: Select validated final NS2 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run') {
            $runId = $env:EVENT_RUN_ID
            $runNumber = $env:EVENT_RUN_NUMBER
            $sha = $env:EVENT_HEAD_SHA

            $branchSha = gh api "repos/$env:GITHUB_REPOSITORY/branches/ns2-pokopia-final-perf" --jq '.commit.sha'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($sha -ne $branchSha) {
              Write-Host "Skipping superseded successful run #$runNumber ($sha); current final-performance head is $branchSha."
              'SKIP_PUBLISH=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
          } else {
            $latestJson = gh run list --repo $env:GITHUB_REPOSITORY --workflow ns2-final-zen4.yml --branch ns2-pokopia-final-perf --status success --limit 1 --json databaseId,number,headSha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $latest = @($latestJson | ConvertFrom-Json) | Select-Object -First 1
            if (-not $latest) { throw 'No successful final Zen4 NS2 build was found for manual publication.' }
            $runId = [string]$latest.databaseId
            $runNumber = [string]$latest.number
            $sha = [string]$latest.headSha
          }

          if (-not $runId -or -not $sha) { throw 'Unable to identify validated final NS2 build metadata.' }
          $shortSha = $sha.Substring(0, 8)
          'SKIP_PUBLISH=0' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VALIDATED_RUN_ID=$runId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VALIDATED_RUN_NUMBER=$runNumber" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VALIDATED_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VALIDATED_SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download final optimized Windows artifact
        if: ${{ env.SKIP_PUBLISH != '1' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = "Eden-NS2-Final-PGO-Zen4-Windows-$env:VALIDATED_SHA"
          gh run download $env:VALIDATED_RUN_ID --repo $env:GITHUB_REPOSITORY --name $artifact --dir package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'package' -PathType Container)) { throw 'Final Windows artifact was not downloaded.' }
          $gui = @('eglantine.exe', 'eden.exe', 'yuzu.exe') |
            ForEach-Object { Join-Path 'package' $_ } |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $gui) { throw 'Final artifact does not contain an Eden GUI executable.' }
          if (-not (Test-Path 'package\FINAL_BUILD_NOTES.txt' -PathType Leaf)) { throw 'Final artifact is missing FINAL_BUILD_NOTES.txt.' }
          Write-Host "Validated final release GUI: $gui"

      - name: Package release ZIP
        if: ${{ env.SKIP_PUBLISH != '1' }}
        shell: pwsh
        run: |
          $zip = "Eden-NS2-Final-PGO-Zen4-$env:VALIDATED_SHORT_SHA-Windows.zip"
          Compress-Archive -Path package\* -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name,Length
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        if: ${{ env.SKIP_PUBLISH != '1' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ns2-final-zen4-$env:VALIDATED_SHORT_SHA"
          $title = "Eden NS2 Final Zen4 PGO $env:VALIDATED_SHORT_SHA"
          $notes = @"
          Validated Eden Switch 2 / Pokopia final optimized Windows build from CI run #$env:VALIDATED_RUN_NUMBER.

          Integration commit: $env:VALIDATED_SHA
          Artifact source run: $env:VALIDATED_RUN_ID

          This package uses the canonical final NS2 performance stack, the validated PokeDinner/Eglantine and Build-31 performance work, shader/runtime compatibility improvements, NS2 memory/loader fixes, LLVM profile-guided optimization, safe Zen 4 tuning with -mtune=znver4, and portable Windows runtime dependency packaging.

          Experimental software; compatibility and performance are still in development.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:RELEASE_ZIP --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:VALIDATED_SHA --title $title --notes $notes
          } else {
            gh release create $tag $env:RELEASE_ZIP --repo $env:GITHUB_REPOSITORY --target $env:VALIDATED_SHA --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
