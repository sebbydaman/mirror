name: Publish Eden NS2 Pokopia Release

on:
  workflow_run:
    workflows:
      - Build Eden NS2 Pokopia
    types:
      - completed
    branches:
      - ns2-pokopia
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2025
    steps:
      - name: Select validated NS2 build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run') {
            $runId = $env:EVENT_RUN_ID
            $runNumber = $env:EVENT_RUN_NUMBER
            $sha = $env:EVENT_HEAD_SHA
          } else {
            $latestJson = gh run list --repo $env:GITHUB_REPOSITORY --workflow ns2-pokopia.yml --branch ns2-pokopia --status success --limit 1 --json databaseId,number,headSha
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $latest = @($latestJson | ConvertFrom-Json) | Select-Object -First 1
            if (-not $latest) { throw 'No successful ns2-pokopia build was found for manual publication.' }
            $runId = [string]$latest.databaseId
            $runNumber = [string]$latest.number
            $sha = [string]$latest.headSha
          }

          if (-not $runId -or -not $sha) { throw 'Unable to identify validated NS2 build metadata.' }
          $shortSha = $sha.Substring(0, 8)
          "VALIDATED_RUN_ID=$runId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VALIDATED_RUN_NUMBER=$runNumber" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VALIDATED_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VALIDATED_SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download validated Windows artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:VALIDATED_RUN_ID --repo $env:GITHUB_REPOSITORY --name Eden-NS2-Pokopia-Windows --dir package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'package' -PathType Container)) { throw 'Validated Windows artifact was not downloaded.' }
          $gui = @('eglantine.exe', 'eden.exe', 'yuzu.exe') |
            ForEach-Object { Join-Path 'package' $_ } |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $gui) { throw 'Validated artifact does not contain an Eden GUI executable.' }
          if (-not (Test-Path 'package\RUNTIME_MANIFEST.txt' -PathType Leaf)) { throw 'Validated artifact is missing RUNTIME_MANIFEST.txt.' }
          Write-Host "Validated release GUI: $gui"

      - name: Package release ZIP
        shell: pwsh
        run: |
          $zip = "Eden-NS2-Pokopia-$env:VALIDATED_SHORT_SHA-Windows.zip"
          Compress-Archive -Path package\* -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name,Length
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ns2-pokopia-$env:VALIDATED_SHORT_SHA"
          $title = "Eden NS2 Pokopia validated build $env:VALIDATED_SHORT_SHA"
          $notes = @"
          Validated Eden Switch 2 / Pokopia Windows build from CI run #$env:VALIDATED_RUN_NUMBER.

          Integration commit: $env:VALIDATED_SHA
          Artifact source run: $env:VALIDATED_RUN_ID

          This package includes the current ns2-pokopia integration, PokeDinner/Eglantine GPU performance work, shader/runtime compatibility improvements, NS2 memory/loader work, regression validation, and portable Windows runtime dependency packaging present in the validated build.

          Experimental software; compatibility and performance are still in development.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:RELEASE_ZIP --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:VALIDATED_SHA --title $title --notes $notes
          } else {
            gh release create $tag $env:RELEASE_ZIP --repo $env:GITHUB_REPOSITORY --target $env:VALIDATED_SHA --title $title --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
